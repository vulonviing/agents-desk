<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agents Desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231b1d2b'/%3E%3Crect x='3' y='8' width='10' height='4' fill='%23b98a5a'/%3E%3Crect x='5' y='3' width='6' height='5' fill='%237c5cff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/office.css">
</head>
<body>
  <header class="bar">
    <h1>Agents Desk</h1>
    <nav id="floors" class="floors" aria-label="Katlar"></nav>
    <div class="bar-right">
      <span id="stamp" class="stamp"></span>
      <button id="rescan" type="button">Yeniden tara</button>
    </div>
  </header>
  <main class="stage">
    <section class="view" id="view">
      <canvas id="floor" aria-label="Ofis kat planı"></canvas>
      <button id="back" class="back" type="button" hidden>← Kata dön</button>
      <div class="zoom" role="group" aria-label="Yakınlaştırma">
        <button id="zoom-in" type="button" aria-label="Yakınlaştır">+</button>
        <button id="zoom-out" type="button" aria-label="Uzaklaştır">−</button>
        <button id="zoom-fit" type="button" aria-label="Tüm katı sığdır">⟲</button>
      </div>
      <p class="hint">tekerlekle yakınlaş · sürükleyerek kaydır · odaya girmek için tıkla</p>
      <ul id="desk-list" class="sr-only"></ul>
      <p id="empty" class="empty" hidden></p>
    </section>
    <aside id="panel" class="panel" hidden aria-live="polite"></aside>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
