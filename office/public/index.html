<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agents Desk</title>
  <meta name="theme-color" content="#1b1d2b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231b1d2b'/%3E%3Crect x='4' y='3' width='8' height='6' fill='%23f2c9a0'/%3E%3Crect x='4' y='2' width='8' height='2' fill='%235b3a29'/%3E%3Crect x='3' y='9' width='10' height='5' fill='%237c5cff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/office.css">
</head>
<body>

  <main class="layout">
    <aside id="chat" class="chat-panel" aria-label="Sohbet" hidden></aside>
    <section class="stage">
      <canvas id="office" aria-label="Piksel art açık ofis: masalarda koordinatörler, pencere, LED haber ekranı"></canvas>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      <p class="hint">tekerlek: yakınlaş · sürükle: kaydır · masaya ya da karaktere tıkla</p>
      <div class="zoom" role="group" aria-label="Yakınlaştırma">
        <button id="zoomIn" type="button" aria-label="Yakınlaştır">+</button>
        <button id="zoomOut" type="button" aria-label="Uzaklaştır">−</button>
        <button id="zoomReset" type="button" aria-label="Sığdır">⤢</button>
        <span id="zoomLabel">100%</span>
      </div>
    </section>
  </main>

  <script src="js/markdown.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/display-profile.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/bg.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/leya.js"></script>
  <script src="js/office.js"></script>
  <script src="js/application-workflow.js"></script>
  <script src="js/kitchen-life.js"></script>
  <script src="js/fireplace-life.js"></script>
  <script src="js/life.js"></script>
  <script src="js/news.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/desk-popup.js"></script>
  <script src="js/news-desk.js"></script>
  <script src="js/usage-screen.js"></script>
  <script src="js/application-map.js"></script>
  <script src="js/application-board.js"></script>
  <script src="js/scene-sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
